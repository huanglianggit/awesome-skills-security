name: Report a Correction
description: Report a broken link, stale claim, license change, or removal request.
title: "[Correction] "
labels:
  - correction
body:
  - type: input
    id: entry
    attributes:
      label: Affected entry
      description: Name and URL of the resource that needs correction.
    validations:
      required: true
  - type: dropdown
    id: correction_type
    attributes:
      label: Correction type
      options:
        - Broken or redirected link
        - Inaccurate or stale description
        - License or ownership change
        - Abandoned or archived project
        - Removal request
        - Other non-sensitive correction
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
      description: Explain what should change and why.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Primary-source evidence
      description: Link to the upstream repository, advisory, documentation, or announcement.
    validations:
      required: true
